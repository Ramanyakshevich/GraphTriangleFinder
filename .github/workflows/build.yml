name: Budowanie aplikacji Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Pobieranie kodu z repozytorium
      uses: actions/checkout@v4

    - name: Konfiguracja środowiska Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalacja zależności
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter networkx matplotlib pyinstaller

    - name: Budowanie pliku EXE przy użyciu PyInstaller
      run: >
        pyinstaller --onefile --windowed 
        --collect-all customtkinter 
        --name "TriangleFinderApp" 
        main.py

    - name: Przesyłanie gotowego pliku (Artefakt)
      uses: actions/upload-artifact@v4
      with:
        name: TriangleFinderApp-Windows-EXE
        path: dist/TriangleFinderApp.exe
